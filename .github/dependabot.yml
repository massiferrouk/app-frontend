# Dependabot — veille automatisée des dépendances (frontend Flutter).
# Dependabot ouvre automatiquement des pull requests de mise à jour ;
# la CI (flutter analyze + flutter test) les valide, l'humain décide du merge.
version: 2
updates:
  # Dépendances Dart / Flutter (pubspec.yaml)
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "frontend"]
    commit-message:
      prefix: "chore(deps)"

  # Actions GitHub utilisées par le pipeline CI
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(deps)"
